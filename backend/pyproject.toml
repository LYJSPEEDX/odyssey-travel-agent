[project]
name = "odyssey-backend"
version = "0.1.0"
description = "Odyssey travel agent backend (FastAPI + LangGraph + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "langchain-core>=1.6.13",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "httpx>=0.28.1",
    "airportsdata>=20260905",
    "jsonschema[format]>=4.23,<5",
]

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.6",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
